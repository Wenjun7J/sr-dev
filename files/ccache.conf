# StarRocks BE 专用 ccache 配置
# sloppiness: BE 开了 WITH_PCH=ON，ccache 默认拒绝缓存使用预编译头的编译，
#             实测导致 78.4% 的编译完全绕过缓存。解开这把锁是最大的一笔收益。
sloppiness = pch_defines,time_macros
# 三种 BUILD_TYPE(Debug/Release/ASAN)的条目互不共享，一次全量约 4-8GB
max_size = 75G
compression = true
compression_level = 1
# 目录由容器挂载宿主卷提供，重建容器不丢
cache_dir = /ccache
