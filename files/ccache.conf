# ccache settings for StarRocks BE.
# With WITH_PCH=ON, default ccache settings reject compilations using precompiled
# headers. This bypassed caching for 78.4% of compilations in the benchmark.
sloppiness = pch_defines,time_macros
# GCC .gch bytes are not reproducible, so hashing them invalidates every TU after
# a PCH rebuild. Hash <gch>.sum instead, generated by ccache-pch from preprocessed headers.
pch_external_checksum = true
# sr-build sets CCACHE_BASEDIR to the source root; omit the working directory from
# the hash as well. build.sh uses -ffile-prefix-map for relative debug paths, allowing
# object reuse across source directories and users.
hash_dir = false
# Debug, Release, and ASAN entries are separate; a full build typically uses 4-8 GB.
max_size = 75G
compression = true
compression_level = 1
# A host-mounted volume preserves the cache across container recreation.
cache_dir = /ccache
