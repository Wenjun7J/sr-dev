# StarRocks BE 专用 ccache 配置
# sloppiness: BE 开了 WITH_PCH=ON，ccache 默认拒绝缓存使用预编译头的编译，
#             实测导致 78.4% 的编译完全绕过缓存。解开这把锁是最大的一笔收益。
sloppiness = pch_defines,time_macros
# GCC 的 .gch 字节不可复现，按内容哈希会让每次 PCH 重建后所有 TU miss；
# 改为哈希 <gch>.sum（由 ccache-pch launcher 在编 PCH 时按预处理结果生成，只随头文件内容变）
pch_external_checksum = true
# key 与目录无关：sr-build 以源码树根为 CCACHE_BASEDIR 把树内路径相对化，这里再关掉工作目录参与哈希。
# 调试信息里的路径 build.sh 本就用 -ffile-prefix-map 抹成相对，.o 与目录无关，跨目录/跨人共享是安全的。
hash_dir = false
# 三种 BUILD_TYPE(Debug/Release/ASAN)的条目互不共享，一次全量约 4-8GB
max_size = 75G
compression = true
compression_level = 1
# 目录由容器挂载宿主卷提供，重建容器不丢
cache_dir = /ccache
