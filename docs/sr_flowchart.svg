<svg width="1320" height="2620" viewBox="0 0 1320 2620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,1 10,5 0,9" fill="#334155"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,1 10,5 0,9" fill="#9f1239"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,1 10,5 0,9" fill="#15803d"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,1 10,5 0,9" fill="#0e7490"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,1 10,5 0,9" fill="#b45309"/></marker>
  </defs>
  <style>
    .t{font-size:13.5px;fill:#0f172a;font-weight:600}
    .s{font-size:11px;fill:#64748b}
    .d{font-size:13px;fill:#1e1b4b;font-weight:600}
    .lb{font-size:11px;fill:#475569;font-weight:600}
    .note{font-size:11.5px;fill:#64748b}
    .noteK{font-size:11.5px;fill:#0e7490}
    .noteW{font-size:11.5px;fill:#b45309}
    .m{font-family:"SF Mono",Menlo,monospace}
  </style>

  <text x="660" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0b0e18">sr build 完整流程</text>
  <text x="660" y="58" text-anchor="middle" font-size="12.5" fill="#5c6376">一个容器编 3.3+ 所有版本：依赖按 digest 拉、编译时 bind 到规范路径、编译器按版本选；右侧是出口与实测依据</text>

  <!-- 1 start -->
  <rect x="290" y="86" width="220" height="46" rx="23" fill="#1e1b4b"/>
  <text x="400" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" class="m">sr build</text>
  <line x1="400" y1="132" x2="400" y2="168" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 2 找源码树 -->
  <rect x="250" y="170" width="300" height="56" rx="4" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
  <text x="266" y="194" class="t">从 $PWD 逐级上溯</text>
  <text x="266" y="214" class="s">找 build.sh + env.sh + be/src</text>
  <line x1="400" y1="226" x2="400" y2="256" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 3 菱形 在源码树里? -->
  <polygon points="400,258 540,300 400,342 260,300" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="400" y="305" text-anchor="middle" class="d">在源码树里？</text>
  <text x="410" y="358" class="lb">是</text>
  <line x1="400" y1="342" x2="400" y2="378" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="300" x2="700" y2="300" stroke="#9f1239" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="560" y="292" class="lb" fill="#9f1239">否</text>
  <rect x="702" y="276" width="230" height="48" rx="24" fill="#fff1f2" stroke="#9f1239" stroke-width="1.5"/>
  <text x="717" y="305" font-size="12.5" fill="#9f1239" font-weight="600">报错退出，提示显式指定目录</text>

  <!-- 4 推断 profile -->
  <rect x="250" y="380" width="300" height="72" rx="4" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
  <text x="266" y="404" class="t">解析 -v 指定的官方镜像</text>
  <text x="266" y="423" class="s">main / 4.1 / 3.5.20 → registry tag</text>
  <text x="266" y="441" class="s">HEAD manifest 拿 digest（~50ms，不 pull）</text>
  <text x="962" y="410" class="note">不自动推断版本；按(源码树,分支)记住上次的</text>
  <text x="962" y="429" class="note">自动跟随最新 digest，变了提醒 rebase</text>
  <line x1="400" y1="452" x2="400" y2="482" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 5 菱形 镜像匹配? -->
  <polygon points="400,484 540,526 400,568 260,526" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="400" y="524" text-anchor="middle" class="d">该 digest 的</text>
  <text x="400" y="542" text-anchor="middle" class="d">依赖已在本地？</text>
  <text x="410" y="584" class="lb">是</text>
  <line x1="400" y1="568" x2="400" y2="604" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="526" x2="700" y2="526" stroke="#b45309" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="560" y="518" class="lb" fill="#b45309">否</text>
  <rect x="702" y="496" width="230" height="60" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="717" y="520" font-size="12.5" fill="#b45309" font-weight="600">拷 thirdparty ∥ 唤醒农场</text>
  <text x="717" y="540" class="s">拉 7s；农场若睡着同时后台 resume</text>
  <path d="M817 556 L817 586 L400 586" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#ao)"/>
  <text x="962" y="520" class="note">每个 digest 只拷一次，存 $HOME/thirdparty/&lt;digest&gt;/</text>
  <text x="962" y="539" class="note">首用新 digest 必是全量，直接叫醒不必等 miss</text>

  <!-- 6 exec -->
  <rect x="250" y="606" width="300" height="56" rx="4" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
  <text x="266" y="630" class="t">exec 进唯一容器 · 私有 mount ns</text>
  <text x="266" y="650" class="s">该版本依赖 bind 到 /var/local/thirdparty，选对应 gcc</text>
  <line x1="400" y1="662" x2="400" y2="692" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 7 菱形 有农场? -->
  <polygon points="400,694 540,736 400,778 260,736" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="400" y="741" text-anchor="middle" class="d">有农场？</text>
  <text x="410" y="794" class="lb">有</text>
  <line x1="400" y1="778" x2="400" y2="814" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="736" x2="700" y2="736" stroke="#9f1239" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="560" y="728" class="lb" fill="#9f1239">无</text>
  <rect x="702" y="706" width="230" height="60" rx="24" fill="#fff1f2" stroke="#9f1239" stroke-width="1.5"/>
  <text x="717" y="730" font-size="12.5" fill="#9f1239" font-weight="600">不开工（无农场 / degraded）</text>
  <text x="717" y="750" class="s">resume 修复仍连不上会标 degraded</text>
  <text x="962" y="730" class="note">开 5 台云机器是花钱的对外动作，</text>
  <text x="962" y="749" class="note">不该由一句 sr build 隐式触发</text>

  <!-- 8 菱形 同树在编? -->
  <polygon points="400,816 540,858 400,900 260,858" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="400" y="856" text-anchor="middle" class="d">同一棵树</text>
  <text x="400" y="874" text-anchor="middle" class="d">已在编译？</text>
  <text x="410" y="916" class="lb">否</text>
  <line x1="400" y1="900" x2="400" y2="936" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="858" x2="700" y2="858" stroke="#9f1239" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="560" y="850" class="lb" fill="#9f1239">是</text>
  <rect x="702" y="834" width="230" height="48" rx="24" fill="#fff1f2" stroke="#9f1239" stroke-width="1.5"/>
  <text x="717" y="863" font-size="12.5" fill="#9f1239" font-weight="600">退出（gensrc 产物会互相覆盖）</text>
  <text x="962" y="852" class="note">锁按源码树分，不同 worktree 可并行</text>
  <text x="962" y="871" class="note">本机总并发由 iceccd -m 16 兜住</text>

  <!-- 9 数边数 -->
  <rect x="250" y="938" width="300" height="56" rx="4" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
  <text x="266" y="962" class="t">build.sh --configure-only 后 ninja -n</text>
  <text x="266" y="982" class="s">先 configure 再数边，否则依赖路径一变全脏却数到 0</text>
  <line x1="400" y1="994" x2="400" y2="1024" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 10 菱形 农场状态 -->
  <polygon points="400,1026 560,1078 400,1130 240,1078" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="400" y="1074" text-anchor="middle" class="d">农场状态</text>
  <text x="400" y="1092" text-anchor="middle" class="d">与 N 多大？</text>

  <!-- 三个出口 -->
  <path d="M240 1078 L120 1078 L120 1186" fill="none" stroke="#0e7490" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="126" y="1070" class="lb" fill="#0e7490">Running 且 N&gt;50</text>
  <rect x="20" y="1188" width="210" height="80" rx="4" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="34" y="1212" font-size="12.5" fill="#0e7490" font-weight="600">直接外发</text>
  <text x="34" y="1231" class="s">并发 = worker数×8 + 本机16</text>
  <text x="34" y="1249" class="s">5 台时 -j56，无任何等待</text>

  <line x1="400" y1="1130" x2="400" y2="1186" stroke="#b45309" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="408" y="1152" class="lb" fill="#b45309">Suspended 且 N&gt;150</text>
  <rect x="252" y="1188" width="296" height="80" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="266" y="1212" font-size="12.5" fill="#b45309" font-weight="600">立刻开工，后台 sr-farm resume ⟵ 唤醒在这</text>
  <text x="266" y="1231" class="s">全新构建树 → 立即 resume（藏进 configure）</text>
  <text x="266" y="1249" class="s">否则攒够 8 次 ccache miss 才唤醒；resume 先等平台落定</text>

  <path d="M560 1078 L660 1078 L660 1186" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="570" y="1070" class="lb">N 太小</text>
  <rect x="570" y="1188" width="180" height="80" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="584" y="1212" font-size="12.5" fill="#334155" font-weight="600">本地 -j16</text>
  <text x="584" y="1231" class="s">外发的搬运费</text>
  <text x="584" y="1249" class="s">超过收益</text>

  <text x="790" y="1212" class="noteK">实测：改 1 个 TU 走农场亏 1.9%，</text>
  <text x="790" y="1231" class="noteK">改 377 个赚 45%，改 933 个赚 59%</text>
  <text x="790" y="1252" class="noteW">唤醒 29 秒被本地编译完全吃掉</text>

  <!-- 汇合 -->
  <path d="M125 1268 L125 1300 L400 1300" fill="none" stroke="#0e7490" stroke-width="1.4"/>
  <path d="M660 1268 L660 1300 L400 1300" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <line x1="400" y1="1268" x2="400" y2="1300" stroke="#b45309" stroke-width="1.4"/>
  <line x1="400" y1="1300" x2="400" y2="1336" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 11 iceccd 存活 -->
  <rect x="240" y="1338" width="320" height="70" rx="4" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
  <text x="256" y="1362" class="t">确认本地 iceccd 活着（排除僵尸）</text>
  <text x="256" y="1381" class="s">读 /proc/PID/stat 排掉 Z 状态；端口被占则复用</text>
  <text x="256" y="1399" style="font-size:11px" fill="#b45309">起不来 → 强制降到 -j16，绝不用远端级并发跑本地</text>
  <text x="790" y="1368" class="noteW">这道闸门失效会静默把并发放大 3.5 倍，</text>
  <text x="790" y="1387" class="noteW">-j56 全落本地 → 48G 容器必被 OOM 杀</text>
  <line x1="400" y1="1408" x2="400" y2="1440" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 12 ninja 取边 -->
  <rect x="250" y="1442" width="300" height="48" rx="4" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="266" y="1471" class="t">ninja 取下一条边，调用 g++</text>
  <line x1="400" y1="1490" x2="400" y2="1520" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 13 ccache 判断：命中走右侧，未命中继续向下 -->
  <polygon points="400,1522 540,1564 400,1606 260,1564" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
  <text x="400" y="1562" text-anchor="middle" class="d" fill="#14532d">ccache</text>
  <text x="400" y="1580" text-anchor="middle" class="d" fill="#14532d">命中？</text>
  <line x1="540" y1="1564" x2="616" y2="1564" stroke="#15803d" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="556" y="1556" class="lb" fill="#15803d">命中</text>
  <rect x="618" y="1538" width="186" height="52" rx="4" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
  <text x="632" y="1560" font-size="12.5" fill="#14532d" font-weight="600">直接取 .o</text>
  <text x="632" y="1579" class="s">4~5 ms，不产生任何编译</text>
  <text x="836" y="1556" class="note">按 编译器+命令行+预处理输出 算哈希</text>
  <text x="836" y="1575" class="noteK">PCH 默认让 78.4% 编译绕过缓存，</text>
  <text x="836" y="1594" class="noteK">加 sloppiness 后降到 0.96%</text>

  <text x="410" y="1622" class="lb" fill="#b45309">未命中</text>
  <line x1="400" y1="1606" x2="400" y2="1642" stroke="#b45309" stroke-width="1.6" marker-end="url(#ao)"/>

  <!-- 14 icecc -->
  <rect x="250" y="1644" width="300" height="56" rx="4" fill="#fff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="266" y="1668" class="t" fill="#0e7490">交给本地 iceccd 要一台机器</text>
  <text x="266" y="1688" class="s">客户端必须经本地 daemon 中转</text>
  <line x1="400" y1="1700" x2="400" y2="1730" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 15 scheduler 派给谁 -->
  <polygon points="400,1732 540,1774 400,1816 260,1774" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="400" y="1772" text-anchor="middle" class="d" fill="#0e7490">scheduler</text>
  <text x="400" y="1790" text-anchor="middle" class="d" fill="#0e7490">派给谁？</text>
  <path d="M340 1806 L280 1846" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="236" y="1836" class="lb" fill="#b45309">本机</text>
  <path d="M460 1806 L520 1846" fill="none" stroke="#0e7490" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="522" y="1836" class="lb" fill="#0e7490">远端</text>

  <rect x="150" y="1854" width="220" height="56" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="164" y="1878" font-size="12.5" fill="#b45309" font-weight="600">本机编译</text>
  <text x="164" y="1897" class="s">最多 16 个并发，本机出满力</text>

  <rect x="430" y="1854" width="250" height="56" rx="4" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="444" y="1878" font-size="12.5" fill="#0e7490" font-weight="600">派给远端 worker</text>
  <text x="444" y="1897" class="s">预处理源码直连传过去，不过 scheduler</text>

  <text x="720" y="1872" class="note">压到 -m 4 反而慢 44%（820s→1180s）——本机该出满力</text>
  <text x="720" y="1891" class="note">worker 的 OS 无关：客户端把自己的 gcc 连同 libc 打包传过去</text>

  <!-- 汇合 -->
  <path d="M260 1910 L260 1942 L400 1942" fill="none" stroke="#b45309" stroke-width="1.4"/>
  <path d="M555 1910 L555 1942 L400 1942" fill="none" stroke="#0e7490" stroke-width="1.4"/>
  <path d="M711 1590 L711 1942 L400 1942" fill="none" stroke="#15803d" stroke-width="1.4"/>
  <line x1="400" y1="1942" x2="400" y2="1972" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 16 还有边吗 -->
  <polygon points="400,1974 540,2016 400,2058 260,2016" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="400" y="2021" text-anchor="middle" class="d">还有边？</text>
  <path d="M260 2016 L60 2016 L60 1458 L244 1458" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="70" y="2008" class="lb">有</text>
  <text x="200" y="2360" class="s">OOM 重试的回边也接到取边处（ninja 增量，只补没编完的）</text>
  <text x="70" y="1512" class="s">回到取边，直到 1767 条边全部编完</text>
  <text x="410" y="2074" class="lb">没有了</text>
  <line x1="400" y1="2058" x2="400" y2="2094" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 17 链接 -->
  <rect x="250" y="2096" width="300" height="56" rx="4" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
  <text x="266" y="2120" class="t">链接 starrocks_be</text>
  <text x="266" y="2140" class="s">2.4 GB，串行，分布式帮不上</text>
  <text x="600" y="2126" class="noteW">和 aggregator.cpp 单个 TU 188~226s 一起，</text>
  <text x="600" y="2145" class="noteW">构成任何工具都碰不到的硬底</text>
  <line x1="400" y1="2152" x2="400" y2="2182" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 18 java-ext -->
  <rect x="250" y="2184" width="300" height="52" rx="4" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
  <text x="266" y="2208" class="t">构建 java-extensions</text>
  <text x="266" y="2227" class="s">热 .m2 仅 5.8 秒（冷的要 9 分钟）</text>
  <text x="600" y="2214" class="note">跳过会导致 jni-packages 缺 jar，</text>
  <text x="600" y="2233" class="note">Hive / Iceberg 连接器运行时失败</text>
  <line x1="400" y1="2236" x2="400" y2="2266" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 19 OOM -->
  <polygon points="400,2268 540,2310 400,2352 260,2310" fill="#fff1f2" stroke="#9f1239" stroke-width="1.5"/>
  <text x="400" y="2308" text-anchor="middle" class="d" fill="#9f1239">失败且有</text>
  <text x="400" y="2326" text-anchor="middle" class="d" fill="#9f1239">OOM 痕迹？</text>
  <line x1="540" y1="2310" x2="700" y2="2310" stroke="#9f1239" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="560" y="2302" class="lb" fill="#9f1239">是</text>
  <rect x="702" y="2284" width="230" height="52" rx="4" fill="#fff1f2" stroke="#9f1239" stroke-width="1.4"/>
  <text x="717" y="2306" font-size="12.5" fill="#9f1239" font-weight="600">降一半并发自动重试</text>
  <text x="717" y="2325" class="s">ninja 增量，只补没编完的</text>
  <path d="M817 2336 L817 2366 L110 2366 L110 1430 L244 1430" fill="none" stroke="#9f1239" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="962" y="2308" class="note">三个独立读数：cgroup oom_kill 计数、</text>
  <text x="962" y="2327" class="note">g++ 自报被杀、自采样 anon 峰值</text>
  <text x="410" y="2382" class="lb">否</text>
